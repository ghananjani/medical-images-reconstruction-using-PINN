name: CPU smoke tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check --select E4,E7,E9,F src tests dashboard
      - run: pytest -q
      - run: medrecon-demo --modality ct --size 32 --output outputs/smoke
